name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --no-daemon
      - run: python3 scripts/check_native_alignment.py app/build/outputs/apk/release/app-release-unsigned.apk --require-native
      - run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - run: python3 scripts/check_legacy_migration.py
      - run: python3 scripts/check_health_sync_storage.py
      - run: python3 scripts/check_architecture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-and-unsigned-bundle
          path: |
            app/schemas/
            app/build/test-results/
            app/build/reports/
            app/build/outputs/bundle/release/
            app/build/outputs/apk/release/
